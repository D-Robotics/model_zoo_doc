name: Update Algolia search index

on:
  workflow_call:
    secrets:
      ALGOLIA_ADMIN_API_KEY:
        required: true
  workflow_dispatch:

concurrency:
  # Never let two full rebuilds write to the same index at the same time.
  group: algolia-index-model_zoo_doc
  cancel-in-progress: false

jobs:
  index:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Wait for CDN / Pages propagation
        run: sleep 20

      - name: Build and upload index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: 1VU781LYTV
          ALGOLIA_INDEX_NAME: model_zoo_doc
          ALGOLIA_SITE_URL: https://developer.d-robotics.cc/model_zoo_doc/
        run: npm run algolia:index

      - name: Setup ossutil v2
        run: |
          if [ ! -x "$HOME/ossutil" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
            unzip ossutil.zip
            cd ossutil-2.1.2-linux-amd64
            chmod 755 ossutil
            mv ossutil "$HOME/ossutil"
          fi

      # 覆盖式单文件上传：MCP 读取站点根目录的 search-index.json。
      # 不能带 -r / --update（那只会增不删）。
      - name: Upload search-index.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ~/ossutil cp -f scripts/_algolia_tmp/search-index.json \
            oss://cn-rdk-front-prod/model_zoo_doc/search-index.json \
            -e https://d-robotics.cc \
            -i $OSS_ACCESS_KEY_ID \
            -k $OSS_ACCESS_KEY_SECRET \
            --region cn-beijing \
            --retry-times=3
