name: Update Algolia search index

on:
  workflow_call:
    secrets:
      ALGOLIA_ADMIN_API_KEY:
        required: true
  workflow_dispatch:

concurrency:
  # Never let two full rebuilds write to the same index at the same time.
  group: algolia-index-model_zoo_doc
  cancel-in-progress: false

jobs:
  index:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean install dependencies
        run: |
          rm -rf node_modules
          npm ci

      - name: Wait for CDN / Pages propagation
        run: sleep 20

      - name: Build and upload index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: 1VU781LYTV
          ALGOLIA_INDEX_NAME: model_zoo_doc
          ALGOLIA_SITE_URL: https://developer.d-robotics.cc/model_zoo_doc/
        run: npm run algolia:index
